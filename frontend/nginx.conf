server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React single-page app
    location / {
        try_files $uri /index.html;
    }

    # The browser only talks to this one public address.
    # nginx forwards API calls to the backend services inside the cluster
    # (hello-service / profile-service are Kubernetes Service names).
    location /api/hello/ {
        proxy_pass http://hello-service:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/profile/ {
        proxy_pass http://profile-service:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
