apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  namespace: mern-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profile-service
  template:
    metadata:
      labels:
        app: profile-service
    spec:
      containers:
        - name: profile-service
          image: ${ACR_LOGIN_SERVER}/mern-profile-service:v1
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: profile-secret
                  key: MONGO_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
  namespace: mern-app
spec:
  type: ClusterIP
  selector:
    app: profile-service
  ports:
    - port: 3002
      targetPort: 3002
