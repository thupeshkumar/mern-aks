apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-service
  namespace: mern-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-service
  template:
    metadata:
      labels:
        app: hello-service
    spec:
      containers:
        - name: hello-service
          image: ${ACR_LOGIN_SERVER}/mern-hello-service:v1
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hello-service
  namespace: mern-app
spec:
  type: ClusterIP
  selector:
    app: hello-service
  ports:
    - port: 3001
      targetPort: 3001
